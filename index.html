<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Mind Map</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#1c2028; --muted:#5b6472; --line:#c9ced6; --dot:#d9dde3;
  --root:#22262e; --code:#f3f5f8; --shadow:0 6px 24px rgba(20,25,35,.14); --hit:#ffe27a;
  --c:#22262e; --cl:#8b93a0; --t:#ffffff;
}
.t-logical{--c:#1a6fe8;--cl:#1a6fe8;--t:#e7effd}
.t-physical{--c:#bf4f00;--cl:#bf4f00;--t:#fdeee2}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14171c; --panel:#1d2128; --ink:#e7eaef; --muted:#a0a8b5; --line:#3a414c; --dot:#262b33;
    --root:#2b303a; --code:#12151a; --shadow:0 6px 24px rgba(0,0,0,.5); --hit:#6b5a12;
    --cl:#69727f; --t:#1d2128;
  }
  .t-logical{--cl:#5a9bff;--t:#182640}
  .t-physical{--cl:#f08a3c;--t:#33200f}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px 16px;padding:14px 20px 10px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tools button,.tools input{font:inherit;font-size:12.5px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px}
.tools button{cursor:pointer}
.tools input{width:200px;max-width:100%}
.tools button:hover{border-color:var(--muted)}
.tools button:focus-visible,.tools input:focus-visible,.node:focus-visible{outline:2px solid #1a6fe8;outline-offset:2px}
#count{font-size:12px;color:var(--muted);min-width:70px}

#vp{position:relative;flex:1;min-height:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;
  border-top:1px solid var(--line)}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.link{fill:none;stroke:var(--cl);stroke-width:1.8}
.link.d1{stroke-width:2.4}
#nodes{position:absolute;left:0;top:0}

.node{position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:4px 10px;border-radius:10px;border:1.6px solid var(--cl);background:var(--t);color:var(--ink);
  font:inherit;font-size:12px;line-height:1.25;cursor:pointer;will-change:transform,opacity}
.node .lbl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.node.sel{box-shadow:0 0 0 3px color-mix(in srgb,var(--cl) 35%,transparent)}
.node.hit{background:var(--hit)}
.k-root{background:var(--root);color:#fff;border-color:var(--root);font-weight:700;font-size:14px}
.k-layer{background:var(--c);color:#fff;border-color:var(--c);font-weight:700;font-size:14px}
.k-cat{font-weight:700}
.k-asset{justify-content:flex-start;text-align:left;border-radius:8px}
.tog{position:absolute;right:-11px;top:50%;margin-top:-10px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;
  background:var(--panel);border:1.6px solid var(--cl);color:var(--ink);font:700 11px/17px inherit;font-family:inherit;z-index:2}

.hint{position:absolute;left:14px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:11.5px;color:var(--muted);
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:6px 10px;max-width:calc(100% - 28px)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

#panel{position:absolute;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);
  box-shadow:var(--shadow);padding:16px 18px 24px;overflow-y:auto;transform:translateX(102%);transition:transform .22s ease;z-index:5;cursor:auto}
#panel.open{transform:none}
#panel h2{font-size:16px;margin:0 28px 4px 0}
#panel h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
#panel p{margin:6px 0}
.x{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.kind{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.crumb{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
ul.list{margin:6px 0;padding-left:18px}
ul.list li{margin:3px 0}
ul.list .n{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.stat{background:var(--code);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11.5px;background:var(--code);border:1px solid var(--line);border-radius:6px;padding:1px 7px}

footer{padding:7px 20px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}

@media (max-width:700px){
  header{padding:12px 16px 8px}
  .tools input{width:100%}
  #panel{top:auto;width:100%;height:55%;border-left:0;border-top:1px solid var(--line);transform:translateY(102%)}
  footer{padding:7px 16px}
}
@media (prefers-reduced-motion:reduce){ #panel{transition:none} }
</style>
</head>
<body>
<header>
  <div>
    <h1>Asset Mind Map</h1>
    <div class="sub">Click a node to open the next level: Logical / Physical → category → asset type.</div>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search assets…" aria-label="Search assets">
    <span id="count" aria-live="polite"></span>
    <button id="expandAll">Expand all</button>
    <button id="collapseAll">Collapse all</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="fit">Fit</button>
  </div>
</header>

<main id="vp">
  <div id="world"><svg id="links" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div></div>
  <div class="hint">
    <span>Drag to pan · Ctrl/⌘ + scroll to zoom</span>
    <span><i class="sw" style="background:#1a6fe8"></i>Logical</span>
    <span><i class="sw" style="background:#bf4f00"></i>Physical</span>
  </div>
  <aside id="panel" aria-live="polite"></aside>
</main>

<footer>Source: asset category final.xlsx (Categories and Asset_Types sheets).</footer>

/* ---------- tree ---------- */
const W = [150,150,250,330];
const H = [48,48,48,34];
const SLOT = [64,64,60,42];
const GAP = 70;
const COLX = []; W.reduce((x,w,i) => (COLX[i]=x, x+w+GAP), 0);

const all = [];
function mk(kind, label, parent, extra) {
  const n = Object.assign({kind, label, parent, children:[], depth: parent ? parent.depth+1 : 0, expanded:false,
    x:0, y:0, tx:0, ty:0, o:0, to:0, el:null, path:null, type: parent ? parent.type : null}, extra);
  if (parent) parent.children.push(n);
  all.push(n);
  return n;
}
const root = mk('root', 'Assets', null, {expanded:true});
DATA.forEach(l => {
  const ln = mk('layer', l.layer, root, {type:l.layer.toLowerCase()});
  l.cats.forEach(c => {
    const cn = mk('cat', c.name, ln, {cat:c});
    c.assets.forEach(a => mk('asset', a, cn));
  });
});

const nodesEl = $('#nodes'), linksEl = $('#links'), vp = $('#vp'), world = $('#world'), panel = $('#panel');
let selected = null, query = '';

function create(n) {
  const el = document.createElement('button');
  el.className = `node k-${n.kind} t-${n.type || 'root'}`;
  el.style.width = W[n.depth] + 'px';
  el.style.height = H[n.depth] + 'px';
  el.title = n.label;
  el.innerHTML = `<span class="lbl">${esc(n.label)}</span>` + (n.children.length ? '<span class="tog"></span>' : '');
  el.addEventListener('click', () => onNode(n));
  nodesEl.append(el);
  n.el = el;
  if (n.parent) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('class', `link t-${n.type || 'root'}` + (n.depth === 1 ? ' d1' : ''));
    linksEl.append(p);
    n.path = p;
    n.x = n.parent.x; n.y = n.parent.y; n.o = 0;
  }
  badge(n);
}
function badge(n) {
  if (!n.el) return;
  n.el.classList.toggle('hit', !!query && n.kind === 'asset' && matches(n));
  const t = n.el.querySelector('.tog');
  if (!t) return;
  t.textContent = n.expanded ? '−' : n.children.length;
  n.el.setAttribute('aria-expanded', n.expanded);
}

function layout() {
  let cursor = 0;
  const vis = new Set();
  (function place(n) {
    vis.add(n);
    n.tx = COLX[n.depth];
    if (n.expanded && n.children.length) {
      n.children.forEach(place);
      n.ty = (n.children[0].ty + n.children[n.children.length-1].ty) / 2;
      if (n.depth >= 1) cursor += 14;
    } else {
      n.ty = cursor + SLOT[n.depth]/2;
      cursor += SLOT[n.depth];
    }
  })(root);
  all.forEach(n => {
    if (vis.has(n)) {
      n.to = 1;
      if (!n.el) create(n);
      badge(n);
    } else {
      n.to = 0;
      let a = n.parent; while (a && !vis.has(a)) a = a.parent;
      n.tx = a.tx; n.ty = a.ty;
    }
  });
}

/* ---------- view (pan / zoom) ---------- */
const view = {x:0, y:0, s:1}, tview = {x:0, y:0, s:1};
function applyView() { world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`; }

let raf = 0;
function kick() { if (!raf) raf = requestAnimationFrame(frame); }
function frame() {
  raf = 0;
  const k = 0.2;
  let busy = false;
  for (const n of all) {
    if (!n.el) continue;
    n.x += (n.tx - n.x) * k; n.y += (n.ty - n.y) * k; n.o += (n.to - n.o) * k;
    if (Math.abs(n.tx-n.x) > .4 || Math.abs(n.ty-n.y) > .4 || Math.abs(n.to-n.o) > .02) busy = true;
    else { n.x = n.tx; n.y = n.ty; n.o = n.to; }
    if (n.to === 0 && n.o === 0) {
      n.el.remove(); if (n.path) n.path.remove();
      n.el = null; n.path = null; continue;
    }
    n.el.style.transform = `translate(${n.x}px,${n.y - H[n.depth]/2}px)`;
    n.el.style.opacity = n.o;
    if (n.path) {
      const p = n.parent, sx = p.x + W[p.depth], sy = p.y, ex = n.x, ey = n.y, mx = (sx + ex) / 2;
      n.path.setAttribute('d', `M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey}`);
      n.path.style.opacity = n.o;
    }
  }
  for (const key of ['x','y','s']) {
    view[key] += (tview[key] - view[key]) * k;
    if (Math.abs(tview[key] - view[key]) > (key === 's' ? .002 : .4)) busy = true; else view[key] = tview[key];
  }
  applyView();
  if (busy) kick();
}

function panelInset() { return panel.classList.contains('open') && innerWidth > 700 ? panel.offsetWidth : 0; }
function visibleNodes() { return all.filter(n => n.to === 1); }
function bbox(list) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  list.forEach(n => {
    a = Math.min(a, n.tx); c = Math.max(c, n.tx + W[n.depth]);
    b = Math.min(b, n.ty - H[n.depth]/2); d = Math.max(d, n.ty + H[n.depth]/2);
  });
  return {x0:a, y0:b, x1:c, y1:d};
}
function fit() {
  const r = vp.getBoundingClientRect(), pad = 40, bb = bbox(visibleNodes());
  const aw = r.width - panelInset() - pad*2, ah = r.height - pad*2;
  const s = Math.max(.12, Math.min(aw / (bb.x1-bb.x0), ah / (bb.y1-bb.y0), 1));
  tview.s = s;
  tview.x = pad + (aw - (bb.x1-bb.x0)*s) / 2 - bb.x0*s;
  tview.y = pad + Math.max(0, (ah - (bb.y1-bb.y0)*s) / 2) - bb.y0*s;
  kick();
}
function reveal(list) {
  const r = vp.getBoundingClientRect(), pad = 28, bb = bbox(list), s = tview.s;
  const right = r.width - panelInset() - pad;
  const R = tview.x + bb.x1*s, B = tview.y + bb.y1*s;
  if (R > right) tview.x -= R - right;
  if (tview.x + bb.x0*s < pad) tview.x += pad - (tview.x + bb.x0*s);
  if (B > r.height - pad) tview.y -= B - (r.height - pad);
  if (tview.y + bb.y0*s < pad) tview.y += pad - (tview.y + bb.y0*s);
}
function zoomAt(cx, cy, f, instant) {
  const r = vp.getBoundingClientRect(), s2 = Math.min(2, Math.max(.12, tview.s * f));
  const px = cx - r.left, py = cy - r.top, wx = (px - tview.x) / tview.s, wy = (py - tview.y) / tview.s;
  tview.x = px - wx*s2; tview.y = py - wy*s2; tview.s = s2;
  if (instant) { Object.assign(view, tview); applyView(); } else kick();
}

vp.addEventListener('wheel', e => {
  if (e.target.closest('#panel')) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * .01), true);
  else { tview.x -= e.deltaX; tview.y -= e.deltaY; Object.assign(view, tview); applyView(); }
}, {passive:false});
let drag = null;
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('.node, #panel, .hint')) return;
  drag = {x:e.clientX, y:e.clientY, vx:tview.x, vy:tview.y};
  vp.setPointerCapture(e.pointerId); vp.classList.add('drag');
});
vp.addEventListener('pointermove', e => {
  if (!drag) return;
  tview.x = drag.vx + e.clientX - drag.x; tview.y = drag.vy + e.clientY - drag.y;
  Object.assign(view, tview); applyView();
});
const endDrag = () => { drag = null; vp.classList.remove('drag'); };
vp.addEventListener('pointerup', endDrag); vp.addEventListener('pointercancel', endDrag);

/* ---------- interaction ---------- */
function subtree(n) { return [n].concat(...n.children.map(subtree)); }
function collapse(n) { n.expanded = false; n.children.forEach(collapse); }

function onNode(n) {
  select(n);
  if (!n.children.length) return;
  const oldTy = n.ty;
  if (n.expanded) collapse(n); else n.expanded = true;
  layout();
  tview.y -= (n.ty - oldTy) * tview.s;
  if (n.expanded) reveal(subtree(n).filter(m => m.to === 1).slice(0, 40));
  kick();
}
$('#expandAll').onclick = () => { all.forEach(n => { if (n.children.length) n.expanded = true; }); layout(); fit(); };
$('#collapseAll').onclick = () => { root.children.forEach(collapse); root.expanded = true; layout(); fit(); };
$('#fit').onclick = fit;
const center = () => { const r = vp.getBoundingClientRect(); return [r.left + (r.width - panelInset())/2, r.top + r.height/2]; };
$('#zoomIn').onclick = () => zoomAt(...center(), 1.25);
$('#zoomOut').onclick = () => zoomAt(...center(), 1/1.25);
addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });

/* ---------- search ---------- */
const norm = s => s.toLowerCase();
function matches(n) { return norm(n.label).includes(query) || norm(n.parent.label).includes(query); }
let qt = 0;
$('#q').addEventListener('input', e => {
  clearTimeout(qt);
  qt = setTimeout(() => {
    query = norm(e.target.value.trim());
    root.children.forEach(collapse); root.expanded = true;
    if (query) {
      const hits = all.filter(n => n.kind === 'asset' && matches(n));
      hits.forEach(h => { for (let a = h.parent; a; a = a.parent) a.expanded = true; });
      $('#count').textContent = `${hits.length} match${hits.length === 1 ? '' : 'es'}`;
    } else $('#count').textContent = '';
    layout(); fit();
  }, 150);
});

/* ---------- details panel ---------- */
function select(n) {
  if (selected && selected.el) selected.el.classList.remove('sel');
  selected = n;
  n.el.classList.add('sel');
  panel.innerHTML = panelHTML(n);
  panel.scrollTop = 0;
  panel.classList.add('open');
}
function closePanel() {
  panel.classList.remove('open');
  if (selected && selected.el) selected.el.classList.remove('sel');
  selected = null;
}
panel.addEventListener('click', e => { if (e.target.closest('.x')) closePanel(); });

const assetsIn = n => subtree(n).filter(m => m.kind === 'asset').length;
function panelHTML(n) {
  let h = `<button class="x" aria-label="Close">×</button><div class="kind">${{root:'Root',layer:'Layer',cat:'Category',asset:'Asset type'}[n.kind]}</div>`;
  h += `<h2>${esc(n.label)}</h2>`;
  if (n.kind === 'root') {
    h += `<p>Every asset type from the spreadsheet, split into the logical and physical layers, then by category.</p><div class="stats">` +
      root.children.map(l => `<div class="stat"><b>${l.children.length}</b><span>${esc(l.label)} categories</span></div>`).join('') +
      root.children.map(l => `<div class="stat"><b>${assetsIn(l)}</b><span>${esc(l.label)} asset types</span></div>`).join('') + `</div>`;
  } else if (n.kind === 'layer') {
    h += `<p>${n.children.length} categories · ${assetsIn(n)} asset types</p><h3>Categories</h3><ul class="list">` +
      n.children.map(c => `<li>${esc(c.label)} <span class="n">(${c.children.length})</span></li>`).join('') + `</ul>`;
  } else if (n.kind === 'cat') {
    const c = n.cat;
    h += `<div class="crumb">${esc(n.parent.label)} · Category ${c.id}</div>
      <p><span class="tag">${esc(c.group)}</span></p>
      <h3>Examples</h3><p>${esc(c.ex)}</p>
      <h3>${n.children.length} asset type${n.children.length === 1 ? '' : 's'}</h3><ul class="list">` +
      n.children.map(a => `<li>${esc(a.label)}</li>`).join('') + `</ul>`;
  } else {
    const c = n.parent;
    h += `<div class="crumb">${esc(c.parent.label)} → ${esc(c.label)}</div>
      <h3>Category group</h3><p><span class="tag">${esc(c.cat.group)}</span></p>
      <h3>Category examples</h3><p>${esc(c.cat.ex)}</p>`;
  }
  return h;
}

/* ---------- start ---------- */
layout();
all.forEach(n => { if (n.el) { n.x = n.tx; n.y = n.ty; n.o = 1; } });
fit();
Object.assign(view, tview);
kick();
</script>
